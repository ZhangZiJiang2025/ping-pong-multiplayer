<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卓球ゲーム - 2人対戦</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      /* 中身があふれても上側が見切れないようにする（対応ブラウザのみ） */
      align-items: safe center;
      /* 表示領域の高さに固定（dvh 非対応ブラウザは vh にフォールバック） */
      height: 100vh;
      height: 100dvh;
      padding: 8px;
      /* 通常はあふれないのでスクロールバーは出ない。
         極端に狭い場合の安全弁としてのみ auto にしておく */
      overflow: auto;
      color: white;
    }

    /* 表示領域いっぱいの「確定した高さ」を持つ枠。
       これがないと子要素の max-height:100% が解決されず canvas が縮まない。
       中身は中央寄せなので、デスクトップでの見た目は従来どおり */
    #container {
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    #nameScreen, #gameScreen {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      /* 伸びはせず、縦が足りないときだけ縮む */
      flex: 0 1 auto;
      max-width: 100%;
      min-height: 0;
      overflow: hidden;
    }

    #nameScreen h1 {
      font-size: 2.5em;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    #nameInput {
      padding: 15px;
      font-size: 1.2em;
      border: none;
      border-radius: 10px;
      margin-right: 10px;
      width: 250px;
    }

    #joinButton, #readyButton, #restartButton {
      padding: 15px 30px;
      font-size: 1.2em;
      border: none;
      border-radius: 10px;
      background: #4CAF50;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }

    #joinButton:hover, #readyButton:hover, #restartButton:hover {
      background: #45a049;
    }

    /* 無効化されたボタン（押せないことが分かるようグレーアウト） */
    #readyButton:disabled, #restartButton:disabled {
      background: #9e9e9e;
      opacity: 0.6;
      cursor: not-allowed;
    }

    #readyButton:disabled:hover, #restartButton:disabled:hover {
      background: #9e9e9e;
    }

    #gameScreen {
      display: none;
      /* 表示時は JS が display:flex を設定する。
         canvas 以外は固定高、canvas だけが余りを受け取って伸縮する */
      flex-direction: column;
      align-items: stretch;
    }

    #gameInfo, #statusMessage, #controls, #queueInfo, #keyHelp {
      flex: 0 0 auto;
    }

    #gameInfo {
      margin-bottom: 20px;
      font-size: 1.3em;
    }

    /* flex-direction を明示し、order による左右指定が確実に効くようにする。
       （row-reverse 等が紛れ込んでも左右が反転しないようにするため） */
    #playerNames {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      margin-bottom: 10px;
      font-weight: bold;
      font-size: 1.1em;
    }

    #scores {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      margin-bottom: 20px;
      font-size: 2em;
      font-weight: bold;
    }

    /* canvas を囲む伸縮エリア。余った縦スペースをすべて受け取る */
    #canvasWrap {
      flex: 1 1 auto;
      min-height: 0;
      min-width: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #canvas {
      border: 3px solid white;
      border-radius: 10px;
      background: #1a1a2e;
      display: block;
      margin: 0 auto;
      /* 内部座標(800x500)の縦横比を保ったまま、
         canvasWrap の幅・高さの小さい方に合わせて縮小する。
         box-sizing を content-box に戻し、border 分(3px*2)を差し引く。
         ※ canvas.width/height 属性(800x500)は変更していないため、
           ゲームロジックの座標系には一切影響しない。 */
      box-sizing: content-box;
      aspect-ratio: 800 / 500;
      width: auto;
      height: auto;
      min-width: 0;
      min-height: 0;
      max-width: calc(100% - 6px);
      max-height: calc(100% - 6px);
    }

    #controls {
      margin-top: 20px;
    }

    #statusMessage {
      margin-top: 20px;
      font-size: 1.3em;
      min-height: 30px;
      font-weight: bold;
    }

    .win {
      color: #4CAF50;
      font-size: 1.8em;
      animation: pulse 1s infinite;
    }

    .lose {
      color: #f44336;
      font-size: 1.8em;
    }

    .waiting {
      color: #ffd700;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    #difficultySelector {
      margin: 20px 0;
    }

    #difficultySelector label {
      font-size: 1.1em;
      margin-right: 10px;
    }

    #difficultySelect {
      padding: 8px;
      font-size: 1em;
      border-radius: 5px;
      border: none;
    }

    #queueInfo {
      margin-top: 15px;
      font-size: 1.1em;
      color: #ffd700;
    }

    .hidden {
      display: none;
    }

    #keyHelp {
      margin-top: 20px;
      font-size: 0.9em;
      opacity: 0.8;
    }

    /* 退出後に名前入力画面で出す案内 */
    #leaveNotice {
      margin-bottom: 20px;
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.15);
      font-size: 1em;
      color: #ffd700;
    }

    /* 試合終了後の「再戦する / 退出する」 */
    #postMatchChoice {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #postMatchChoice > button {
      padding: 15px 30px;
      font-size: 1.2em;
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
      min-width: 180px;
    }

    #rematchButton { background: #4CAF50; }
    #rematchButton:hover { background: #45a049; }
    #leaveButton { background: #f44336; }
    #leaveButton:hover { background: #d8382b; }

    /* 選択できないボタンはグレーアウトする */
    #postMatchChoice > button:disabled {
      background: #9e9e9e;
      opacity: 0.6;
      cursor: not-allowed;
    }

    #postMatchChoice > button:disabled:hover {
      background: #9e9e9e;
    }

    #postMatchHint {
      font-size: 0.95em;
      opacity: 0.9;
      min-height: 1.2em;
    }

    /* 選択ボタンは横並びにできる幅があれば横並びにする */
    @media (min-width: 480px) {
      #postMatchChoice {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
      }
      #postMatchHint {
        flex-basis: 100%;
      }
    }

    /* ===== 縦が狭い環境（ノートPC等）だけ余白・文字を圧縮する。
           高さ 820px 超のデスクトップでは上の既定値がそのまま使われる ===== */
    @media (max-height: 820px) {
      #gameScreen {
        padding: 20px 28px;
      }
      #gameInfo { margin-bottom: 10px; font-size: 1.15em; }
      #playerNames { margin-bottom: 4px; }
      #scores { margin-bottom: 10px; font-size: 1.6em; }
      #statusMessage { margin-top: 10px; font-size: 1.15em; min-height: 26px; }
      #controls { margin-top: 10px; }
      #difficultySelector { margin: 10px 0; }
      #queueInfo { margin-top: 8px; }
      #keyHelp { margin-top: 10px; }
    }

    @media (max-height: 620px) {
      body { padding: 4px; }
      #gameScreen {
        padding: 10px 16px;
        border-radius: 12px;
      }
      #gameInfo { margin-bottom: 4px; font-size: 1em; }
      #playerNames { margin-bottom: 2px; font-size: 1em; }
      #scores { margin-bottom: 4px; font-size: 1.3em; }
      #statusMessage { margin-top: 4px; font-size: 1em; min-height: 20px; }
      #controls { margin-top: 4px; }
      #difficultySelector { margin: 4px 0; }
      #readyButton, #restartButton, #abortButton {
        padding: 8px 18px;
        font-size: 1em;
      }
      #queueInfo { margin-top: 4px; font-size: 0.95em; }
      #keyHelp { margin-top: 4px; font-size: 0.8em; }
      .win, .lose { font-size: 1.3em; }
    }
  </style>
</head>
<body>
  <div id="container">
    <!-- 名前入力画面 -->
    <div id="nameScreen">
      <h1>🏓 卓球ゲーム</h1>
      <div id="leaveNotice" class="hidden"></div>
      <input type="text" id="nameInput" placeholder="名前を入力してください" maxlength="15">
      <button id="joinButton">参加</button>
    </div>

    <!-- ゲーム画面 -->
    <div id="gameScreen">
      <div id="gameInfo">
        <div id="playerNames">
          <div id="leftPlayerName">-</div>
          <div id="rightPlayerName">-</div>
        </div>
        <div id="scores">
          <div id="leftScore">0</div>
          <div id="rightScore">0</div>
        </div>
      </div>

      <div id="canvasWrap">
        <canvas id="canvas" width="800" height="500"></canvas>
      </div>

      <div id="statusMessage"></div>

      <div id="controls">
        <div id="difficultySelector" class="hidden">
          <label for="difficultySelect">難易度:</label>
          <select id="difficultySelect">
            <option value="かんたん">かんたん</option>
            <option value="ふつう" selected>ふつう</option>
            <option value="むずかしい">むずかしい</option>
          </select>
        </div>

        <div id="difficultyDisplay" class="hidden">
          <label>難易度:</label>
          <span id="difficultyValue">ふつう</span>
        </div>

        <button id="readyButton" class="hidden">スタート</button>
        <button id="restartButton" class="hidden">再スタート</button>
        <button id="abortButton" class="hidden" style="background: #f44336;">強制終了</button>

        <!-- 試合終了後の選択 -->
        <div id="postMatchChoice" class="hidden">
          <button id="rematchButton">再戦する</button>
          <button id="leaveButton">退出する</button>
          <div id="postMatchHint"></div>
        </div>
      </div>

      <div id="queueInfo" class="hidden"></div>

      <div id="keyHelp">
        矢印キー ↑↓ でパドルを操作
      </div>
    </div>
  </div>

  <script>
    const nameScreen = document.getElementById('nameScreen');
    const gameScreen = document.getElementById('gameScreen');
    const nameInput = document.getElementById('nameInput');
    const joinButton = document.getElementById('joinButton');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const leftPlayerName = document.getElementById('leftPlayerName');
    const rightPlayerName = document.getElementById('rightPlayerName');
    const leftScore = document.getElementById('leftScore');
    const rightScore = document.getElementById('rightScore');
    const statusMessage = document.getElementById('statusMessage');
    const readyButton = document.getElementById('readyButton');
    const restartButton = document.getElementById('restartButton');
    const abortButton = document.getElementById('abortButton');
    const difficultySelector = document.getElementById('difficultySelector');
    const difficultySelect = document.getElementById('difficultySelect');
    const difficultyDisplay = document.getElementById('difficultyDisplay');
    const difficultyValue = document.getElementById('difficultyValue');
    const queueInfo = document.getElementById('queueInfo');
    const postMatchChoice = document.getElementById('postMatchChoice');
    const rematchButton = document.getElementById('rematchButton');
    const leaveButton = document.getElementById('leaveButton');
    const postMatchHint = document.getElementById('postMatchHint');
    const leaveNotice = document.getElementById('leaveNotice');

    // パドルの側（seat）と画面上の表示位置の対応表。
    // ここが唯一の判断基準で、描画(draw)もラベル配置もこの値から導出する。
    // left席のパドルは canvas の x=0 側、right席のパドルは x=canvas.width 側に描かれる。
    const SIDE_ORDER = { left: 1, right: 2 }; // CSS order: 小さいほど画面左

    // サーバーが割り当てた席に基づいてラベル・スコアを配置する
    function renderSideLabels(data) {
      ['left', 'right'].forEach((side) => {
        const nameEl = document.getElementById(side + 'PlayerName');
        const scoreEl = document.getElementById(side + 'Score');

        // 表示内容：その席に座っているプレイヤーの名前とスコア
        nameEl.textContent = data.seats[side] || '-';
        scoreEl.textContent = data.scores[side];

        // 表示位置：DOM順やCSSの既定値に依存せず、席から明示的に決める
        nameEl.style.order = SIDE_ORDER[side];
        scoreEl.style.order = SIDE_ORDER[side];
      });
    }

    let ws;
    let myName = '';
    let mySeat = null;
    let hasLeft = false;        // 自分で退出したか（再接続を抑止する）
    let heartbeatTimer = null;  // ハートビートの多重起動を防ぐ
    let gameState = null;
    let myPaddleY = 250; // ローカルパドル位置
    let previousGameStarted = false; // 前回のゲーム状態

    // WebSocket接続
    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}`);

      ws.onopen = () => {
        console.log('WebSocket接続成功');
        if (myName) {
          ws.send(JSON.stringify({ type: 'join', name: myName }));
        }
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'state') {
          handleStateUpdate(data);
        } else if (data.type === 'removed') {
          // 退出が確定した。自動再接続せずに名前入力画面へ戻す
          handleRemoved();
        }
      };

      ws.onclose = () => {
        console.log('WebSocket切断');
        // 自分で退出した場合は再接続しない
        if (hasLeft) return;
        setTimeout(connect, 1000);
      };

      ws.onerror = (error) => {
        console.error('WebSocketエラー:', error);
      };
    }

    // 状態更新処理
    function handleStateUpdate(data) {
      const oldGameState = gameState;
      gameState = data;
      mySeat = data.mySeat;

      // プレイヤー名・スコア表示
      // サーバーが割り当てたパドルの側（seat）を唯一の根拠として、
      // 同じ側のラベル要素に表示する。入室順には依存しない。
      renderSideLabels(data);

      // 難易度表示
      difficultySelect.value = data.difficulty;
      difficultyValue.textContent = data.difficulty;

      // 自分のパドル位置の同期（特定の条件下のみ）
      if (mySeat && mySeat !== oldGameState?.mySeat) {
        // 席が変わった時（新規参加、復帰時）
        myPaddleY = data.paddles[mySeat] || 250;
      } else if (data.gameStarted && !oldGameState?.gameStarted) {
        // ゲームが開始された瞬間（スタート押下時）
        myPaddleY = 250; // 中央にリセット
      } else if (!data.gameStarted && oldGameState?.gameStarted) {
        // ゲームが終了した瞬間
        myPaddleY = 250; // 中央にリセット
      }
      // 上記以外（特にゲーム中）はサーバーからの更新で上書きしない

      // UIの表示制御
      updateUI(data);
    }

    // UI更新
    function updateUI(data) {
      // 難易度選択（左席でゲーム中でない時）
      if (mySeat === 'left' && !data.gameStarted) {
        difficultySelector.classList.remove('hidden');
        difficultyDisplay.classList.add('hidden');
      } else if (mySeat === 'right' && !data.gameStarted) {
        difficultySelector.classList.add('hidden');
        difficultyDisplay.classList.remove('hidden');
      } else {
        difficultySelector.classList.add('hidden');
        difficultyDisplay.classList.add('hidden');
      }

      // 観戦者（待機列）
      if (mySeat === 'spectator') {
        statusMessage.className = 'waiting';
        statusMessage.textContent =
          `対戦中です。順番をお待ちください（あなたは${data.queuePosition}番目です）`;
        readyButton.classList.add('hidden');
        readyButton.disabled = false;
        restartButton.classList.add('hidden');
        abortButton.classList.add('hidden');
        queueInfo.classList.remove('hidden');
        queueInfo.textContent = `待ち人数: ${data.waitQueueLength}人`;
        // 待機中でも退出は選べる
        showChoiceButtons(data, { allowRematch: false });
        return;
      }

      queueInfo.classList.add('hidden');

      // 試合終了後の選択（再戦 / 退出）— 勝敗より先に判定する
      if (data.postMatch) {
        showPostMatchChoice(data);
        return;
      }
      // 相手不在＝対戦待ち中
      if (!data.hasOpponent) {
        statusMessage.className = 'waiting';
        if (data.opponentDisconnected) {
          statusMessage.textContent = '対戦待ち中（相手との接続が切れました）';
        } else {
          statusMessage.textContent = '対戦待ち中';
        }
        // 相手がいないのでスタートは押せない
        readyButton.classList.remove('hidden');
        readyButton.disabled = true;
        restartButton.classList.add('hidden');
        abortButton.classList.add('hidden');
        // 退出はいつでも選べるようにしておく
        showChoiceButtons(data, { allowRematch: false });
        return;
      }

      // ゲーム中
      if (data.gameStarted) {
        statusMessage.className = '';
        statusMessage.textContent = 'ゲーム中';
        readyButton.classList.add('hidden');
        readyButton.disabled = false;
        restartButton.classList.add('hidden');
        abortButton.classList.remove('hidden'); // 強制終了ボタンを表示
        postMatchChoice.classList.add('hidden');
      }
      // スタート待ち
      else {
        statusMessage.className = '';
        if (data.justSeated) {
          // 待機列から席に入ったばかり
          statusMessage.textContent =
            'あなたの番です！準備ができたらスタートを押してください';
        } else if (data.readyFlags[mySeat]) {
          statusMessage.textContent = '相手の準備を待っています...';
        } else {
          statusMessage.textContent = '準備ができたらスタートを押してください';
        }
        readyButton.classList.remove('hidden');
        readyButton.disabled = false;
        restartButton.classList.add('hidden');
        abortButton.classList.add('hidden'); // 強制終了ボタンを非表示
        // まだ1試合もしていないので「再戦する」は選べない
        showChoiceButtons(data, { allowRematch: false });
      }
    }

    // 「再戦する / 退出する」ボタンの表示制御。
    // allowRematch が false のときは再戦をグレーアウトし、退出だけ選べるようにする。
    function showChoiceButtons(data, options) {
      const allowRematch = options && options.allowRematch;
      postMatchChoice.classList.remove('hidden');

      const chosen = !!data.myChoice;
      rematchButton.disabled = !allowRematch || chosen;
      leaveButton.disabled = chosen;

      if (!allowRematch) {
        // 試合終了後以外では案内文を出さない（退出ボタンのみ使える状態）
        postMatchHint.textContent = '';
      }
    }

    // 試合終了後の「再戦する / 退出する」表示
    function showPostMatchChoice(data) {
      // 勝敗メッセージ
      if (data.result === 'win') {
        statusMessage.className = 'win';
        statusMessage.textContent = 'あなたの勝ち！';
      } else if (data.result === 'lose') {
        statusMessage.className = 'lose';
        statusMessage.textContent = 'あなたの負け';
      } else {
        statusMessage.className = '';
        statusMessage.textContent = '試合終了';
      }

      readyButton.classList.add('hidden');
      readyButton.disabled = false;
      restartButton.classList.add('hidden');
      abortButton.classList.add('hidden');

      // 試合を終えた直後なので「再戦する」も選べる
      showChoiceButtons(data, { allowRematch: true });

      // 選択状況の案内
      const chosen = !!data.myChoice;
      let hint;
      if (!chosen) {
        hint = '「再戦する」か「退出する」を選んでください';
        if (typeof data.postMatchSecondsLeft === 'number') {
          hint += `（残り${data.postMatchSecondsLeft}秒・未選択は退出扱い）`;
        }
      } else if (data.myChoice === 'rematch') {
        hint = '再戦を選びました。相手の選択を待っています...';
      } else {
        hint = '退出しています...';
      }

      if (data.waitQueueLength > 0) {
        hint += ` ／ 待ち人数: ${data.waitQueueLength}人`;
      }
      postMatchHint.textContent = hint;
    }

    // 描画
    function draw(data) {
      // 背景
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 中央線
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 10]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // 左パドル（自分の場合はローカル位置を使用）
      const leftY = mySeat === 'left' ? myPaddleY : data.paddles.left;
      ctx.fillStyle = mySeat === 'left' ? '#4CAF50' : '#ffffff';
      ctx.fillRect(0, leftY, 10, 80);

      // 右パドル（自分の場合はローカル位置を使用）
      const rightY = mySeat === 'right' ? myPaddleY : data.paddles.right;
      ctx.fillStyle = mySeat === 'right' ? '#4CAF50' : '#ffffff';
      ctx.fillRect(canvas.width - 10, rightY, 10, 80);

      // ボール
      if (data.ball) {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(data.ball.x, data.ball.y, 10, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 参加ボタン
    joinButton.addEventListener('click', () => {
      const name = nameInput.value.trim();
      if (!name) {
        alert('名前を入力してください');
        return;
      }

      myName = name;
      hasLeft = false;
      gameState = null;
      mySeat = null;
      leaveNotice.classList.add('hidden');
      nameScreen.style.display = 'none';
      gameScreen.style.display = 'flex';

      connect();

      // ハートビート送信（5秒ごと）。再参加時に二重起動しないようにする
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      heartbeatTimer = setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'heartbeat', name: myName }));
        }
      }, 5000);
    });

    // Enterキーで参加
    nameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        joinButton.click();
      }
    });

    // スタートボタン
    readyButton.addEventListener('click', () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'ready' }));
      }
    });

    // 再スタートボタン
    restartButton.addEventListener('click', () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'restart' }));
      }
    });

    // 難易度変更
    difficultySelect.addEventListener('change', () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'difficulty',
          difficulty: difficultySelect.value
        }));
      }
    });

    // 強制終了ボタン
    abortButton.addEventListener('click', () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'abort' }));
      }
    });

    // 試合終了後：再戦する
    rematchButton.addEventListener('click', () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'rematch' }));
        rematchButton.disabled = true;
        leaveButton.disabled = true;
      }
    });

    // 試合終了後：退出する
    leaveButton.addEventListener('click', () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'leave' }));
        rematchButton.disabled = true;
        leaveButton.disabled = true;
      }
    });

    // サーバーから退出が確定した通知を受けた時の処理
    function handleRemoved() {
      hasLeft = true;
      if (heartbeatTimer) {
        clearInterval(heartbeatTimer);
        heartbeatTimer = null;
      }
      if (ws) ws.close();

      gameState = null;
      mySeat = null;

      // 名前入力画面に戻す
      gameScreen.style.display = 'none';
      nameScreen.style.display = 'block';
      leaveNotice.classList.remove('hidden');
      leaveNotice.textContent = 'ゲームを退出しました。もう一度遊ぶには名前を入力して参加してください';

      // ボタンの状態を戻しておく
      rematchButton.disabled = false;
      leaveButton.disabled = false;
      postMatchChoice.classList.add('hidden');
    }

    // キーボード操作
    const keys = {};
    document.addEventListener('keydown', (e) => {
      keys[e.key] = true;
    });

    document.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    // ゲームループ（描画とローカルパドル更新）
    function gameLoop() {
      // ローカルパドル移動
      if (mySeat && gameState && gameState.gameStarted) {
        const paddleSpeed = 15; // 速度を上げる

        if (keys['ArrowUp']) {
          myPaddleY -= paddleSpeed;
        }
        if (keys['ArrowDown']) {
          myPaddleY += paddleSpeed;
        }

        myPaddleY = Math.max(0, Math.min(420, myPaddleY)); // 420 = 500 - 80
      }

      // 描画
      if (gameState) {
        draw(gameState);
      }

      requestAnimationFrame(gameLoop);
    }
    gameLoop();

    // 選択待ちの残り秒数を毎秒更新する（表示のみ。判定はサーバー側）
    setInterval(() => {
      if (hasLeft) return; // 退出済みなら何もしない
      if (!gameState || !gameState.postMatch) return;
      if (gameState.myChoice) return;
      if (typeof gameState.postMatchSecondsLeft !== 'number') return;
      if (gameState.postMatchSecondsLeft > 0) {
        gameState.postMatchSecondsLeft--;
      }
      showPostMatchChoice(gameState);
    }, 1000);

    // パドル位置をサーバーに送信（30fps）
    setInterval(() => {
      if (mySeat && gameState && gameState.gameStarted) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'paddle',
            y: myPaddleY
          }));
        }
      }
    }, 1000 / 30);
  </script>
</body>
</html>
